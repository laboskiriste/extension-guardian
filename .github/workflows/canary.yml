name: Store parser canary

# Once a day, checks that the store parser still finds the developer of three
# known extensions, read directly and through the live server. A failed run
# means the Chrome Web Store layout changed; GitHub emails the repo owner.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse three store pages
        run: node dev/canary.mjs
        working-directory: server
