name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Neither folder needs npm install to run its tests.
      - name: Extension tests
        run: npm test
        working-directory: extension
      - name: Server tests
        run: npm test
        working-directory: server
