<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Extension Guardian – preview</title>
  <link rel="stylesheet" href="../src/popup/popup.css">
  <style>html:not(.frame) { background: #888; } html:not(.frame) body { margin: 20px auto; box-shadow: 0 4px 24px #0004; }</style>
  <!-- ?frame: no page chrome, for store screenshots. ?open=<id>: expand that extension. -->
  <script>if (new URLSearchParams(location.search).has('frame')) document.documentElement.classList.add('frame');</script>
</head>
<body>
  <div id="app"></div>
  <!-- Fake chrome.* API with sample data, so the popup can be viewed in a normal browser. -->
  <script>
    const ago = (h) => Date.now() - h * 3600e3;
    const cws = 'https://clients2.google.com/service/update2/crx';
    let exts = [
      { id: 'aaaa', name: 'Super Video Downloader', version: '3.2.1', enabled: true, mayDisable: true, type: 'extension', installType: 'normal', updateUrl: cws,
        permissions: ['cookies', 'webRequest', 'tabs', 'storage'], hostPermissions: ['<all_urls>'] },
      { id: 'bbbb', name: 'Night Mode Plus', version: '4.9.133', enabled: true, mayDisable: true, type: 'extension', installType: 'normal', updateUrl: cws,
        permissions: ['storage', 'alarms', 'scripting'], hostPermissions: ['<all_urls>'] },
      { id: 'cccc', name: 'Coupon Finder Pro', version: '1.0.4', enabled: true, mayDisable: true, type: 'extension', installType: 'sideload', updateUrl: 'https://cdn.coupon-deals.example/update.xml',
        permissions: ['tabs', 'history'], hostPermissions: ['*://*/*'] },
      { id: 'dddd', name: 'Quick Translate', version: '2.0.16', enabled: true, mayDisable: true, type: 'extension', installType: 'normal', updateUrl: cws,
        permissions: ['activeTab', 'contextMenus', 'storage'], hostPermissions: [] },
      { id: 'eeee', name: 'Grammar Helper', version: '14.1', enabled: true, mayDisable: true, type: 'extension', installType: 'normal', updateUrl: cws,
        permissions: ['storage'], hostPermissions: ['https://*.google.com/*', 'https://mail.yahoo.com/*'] },
      { id: 'ffff', name: 'Old Screenshot Tool', version: '0.9', enabled: false, mayDisable: true, type: 'extension', installType: 'normal', updateUrl: cws,
        permissions: ['tabs'], hostPermissions: [] },
      { id: 'gggg', name: 'PDF Tools Free', version: '1.2', enabled: true, mayDisable: true, type: 'extension', installType: 'normal', updateUrl: cws,
        permissions: ['scripting', 'tabs'], hostPermissions: ['<all_urls>'] },
      { id: 'hhhh', name: 'Simple Notes', version: '2.0', enabled: true, mayDisable: true, type: 'extension', installType: 'normal', updateUrl: cws,
        permissions: ['storage'], hostPermissions: [] },
    ];
    const store = {
      storeInfo: {
        aaaa: { status: 'ok', developerName: 'Growth Media Partners LLC', email: 'biz@growthmedia.example', website: 'growthmedia.example', trader: 'trader', users: '1,000,000+', updated: 'October 24, 2026', checkedAt: ago(2),
                ownershipChanged: { from: 'Marko Petrovski', to: 'Growth Media Partners LLC', at: ago(2) } },
        bbbb: { status: 'ok', developerName: 'Nightfall Labs Ltd', email: 'support@nightfall.example', website: 'nightfall.example', trader: 'trader', users: '7,000,000', updated: 'September 24, 2026', checkedAt: ago(2) },
        dddd: { status: 'ok', offeredBy: 'Lingo Tools Inc.', trader: 'trader', users: '10,000,000+', updated: 'May 2, 2026', checkedAt: ago(2) },
        eeee: { status: 'ok', offeredBy: 'Writer Tools', email: 'help@writertools.example', trader: 'non-trader', users: '40,000', updated: 'August 1, 2026', checkedAt: ago(2) },
        ffff: { status: 'not_found', checkedAt: ago(2) },
        gggg: { status: 'ok', offeredBy: 'pdftools', trader: 'non-trader', users: '212', updated: 'March 3, 2023', checkedAt: ago(2) },
        hhhh: { status: 'ok', offeredBy: 'Ana', email: 'ana@notes.example', trader: 'non-trader', users: '3,000', updated: 'June 2, 2026', checkedAt: ago(2) },
      },
      alerts: [
        { id: '1', extId: 'aaaa', extName: 'Super Video Downloader', type: 'ownership_changed', severity: 'high', at: ago(2), seen: false,
          title: 'Super Video Downloader may have a new owner',
          detail: 'The developer changed from "Marko Petrovski" to "Growth Media Partners LLC". Extensions are often sold and then turned into adware or spyware.' },
        { id: '2', extId: 'aaaa', extName: 'Super Video Downloader', type: 'new_permissions', severity: 'medium', at: ago(26), seen: false,
          title: 'Super Video Downloader asked for new permissions', detail: 'Can read your cookies; Can watch your network requests' },
        { id: '3', extId: 'ffff', extName: 'Old Screenshot Tool', type: 'removed_from_store', severity: 'high', at: ago(50), seen: true,
          title: 'Old Screenshot Tool was removed from the Chrome Web Store',
          detail: 'Google removes extensions for malware and policy violations. Consider removing it until you know why.' },
      ],
      lastStoreCheckAt: ago(2),
    };
    const changed = [];
    window.chrome = {
      runtime: {
        id: 'self',
        getURL: (p) => '../' + p,
        sendMessage: async (msg) => {
          if (msg.type === 'dismiss') store.alerts = store.alerts.filter((a) => a.id !== msg.id);
          if (msg.type === 'trust') store.storeInfo[msg.extId].ownershipChanged = null;
          if (msg.type === 'scan') await new Promise((r) => setTimeout(r, 800));
          return { ok: true };
        },
      },
      management: {
        getAll: async () => structuredClone(exts),
        setEnabled: async (id, enabled) => { exts.find((e) => e.id === id).enabled = enabled; },
        uninstall: async (id) => { if (confirm('Remove?')) exts = exts.filter((e) => e.id !== id); },
      },
      storage: {
        local: { get: async (defaults) => structuredClone({ ...defaults, ...store }) },
        onChanged: { addListener: () => {} },
      },
      tabs: { create: () => {} },
    };
  </script>
  <script type="module" src="../src/popup/popup.js"></script>
  <script type="module">
    const open = new URLSearchParams(location.search).get('open');
    if (open) {
      await new Promise((r) => setTimeout(r, 300));
      document.querySelector(`#ext-${open} .ext-head`)?.click();
      await new Promise((r) => setTimeout(r, 100));
      document.getElementById(`ext-${open}`)?.scrollIntoView();
    }
  </script>
</body>
</html>
