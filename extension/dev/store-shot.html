<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Store screenshot</title>
  <!-- Chrome Web Store screenshots (1280x800) and promo tile (440x280).
       Rendered by dev/make-store-images.sh with headless Chrome.
       ?scene=1|2|3 picks a screenshot, ?scene=promo the promo tile. ?firefox for Firefox Add-ons. -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 1280px; height: 800px; overflow: hidden;
      display: flex; align-items: center; gap: 72px; padding: 0 96px;
      background: linear-gradient(135deg, #0f3d2e 0%, #1a6b4f 60%, #248c68 100%);
      color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .copy { flex: 1; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; opacity: .9; }
    .brand img { width: 44px; height: 44px; padding: 6px; background: #fff; border-radius: 12px; }
    h1 { font-size: 52px; line-height: 1.1; margin: 28px 0 20px; letter-spacing: -.02em; }
    p { font-size: 22px; line-height: 1.5; margin: 0; opacity: .88; max-width: 560px; }
    .frame {
      flex: none; width: 420px; height: 700px; border-radius: 14px; overflow: hidden;
      background: #fff; box-shadow: 0 24px 60px #0007;
    }
    iframe { width: 420px; height: 700px; border: 0; display: block; }

    body.promo { width: 440px; height: 280px; padding: 0 32px; gap: 0; }
    .promo .copy { text-align: left; }
    .promo .brand { font-size: 26px; gap: 14px; opacity: 1; }
    .promo .brand img { width: 64px; height: 64px; padding: 8px; border-radius: 16px; }
    .promo p { font-size: 19px; margin-top: 18px; }
  </style>
</head>
<body>
  <script>
    const firefox = new URLSearchParams(location.search).has('firefox');
    const scenes = {
      1: { open: null, title: 'Know when an extension gets sold', text: `Get warned when a developer changes, an update asks for more access, or an extension disappears from ${firefox ? 'Firefox Add-ons' : 'the Chrome Web Store'}.` },
      2: { open: 'gggg', title: 'Risk explained in plain language', text: 'See exactly why an extension is risky, and what it can do with your data, without reading permission lists.' },
      3: { open: 'bbbb', title: 'Full access isn\'t always danger', text: 'Trusted, popular extensions stay green. Separate Access and Risk ratings mean you only get alerts that matter.' },
    };
    const scene = new URLSearchParams(location.search).get('scene') ?? '1';
    if (scene === 'promo') {
      document.body.classList.add('promo');
      document.body.innerHTML = `
        <div class="copy">
          <div class="brand"><img src="../icons/icon128.png" alt="">Extension Guardian</div>
          <p>Know when an extension turns bad.</p>
        </div>`;
    } else {
      const s = scenes[scene];
      const src = `preview.html?frame${firefox ? '&firefox' : ''}${s.open ? `&open=${s.open}` : ''}`;
      document.body.innerHTML = `
        <div class="copy">
          <div class="brand"><img src="../icons/icon128.png" alt="">Extension Guardian</div>
          <h1>${s.title}</h1>
          <p>${s.text}</p>
        </div>
        <div class="frame"><iframe src="${src}"></iframe></div>`;
    }
  </script>
</body>
</html>
